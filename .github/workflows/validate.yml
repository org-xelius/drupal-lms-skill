name: Validate Drupal LMS skill

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate bundle and references
        run: python tools/validate_repository.py
      - name: Exercise project inspection
        run: python -m unittest discover -s tests -v
      - name: Check Skills CLI discovery and installation
        run: python tools/check_skills_install.py
